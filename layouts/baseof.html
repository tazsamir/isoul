<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="shell nav"><a class="brand" href="/">isoul.uk</a><nav><a href="/">Home</a><a href="/posts/">Notes</a></nav></header>
  <main class="shell">{{ block "main" . }}{{ end }}</main>
  <footer class="shell footer">Keep it simple. Keep it local. Keep a copy.</footer>
</body>
</html>
